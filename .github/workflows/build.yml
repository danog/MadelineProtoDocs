name: Build docs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.168.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0
          submodules: true

      - name: Install Hugo
        run: |
          wget -q -O /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb

      - name: Build
        run: |
          set -ex
          git config --global user.email "daniil@daniil.it"
          git config --global user.name "Daniil Gentili"
          python3 tools/build_content.py
          rm -rf /tmp/_site
          hugo --minify -d /tmp/_site
          git branch -D gh-pages || true
          git switch --orphan gh-pages
          git clean -ffdxq
          cp -a /tmp/_site/. .
          git add -A
          git commit -am 'Update' >/dev/null
          git push -f origin gh-pages
